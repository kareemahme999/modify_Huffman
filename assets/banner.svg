<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Modified Huffman Coder" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="900" height="260" rx="20" fill="url(#bg)"/>

  <!-- decorative bit stream -->
  <text x="450" y="52" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" letter-spacing="5" fill="#a5b4fc" opacity="0.55">1000110100011010011101111</text>
  <text x="450" y="236" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" letter-spacing="5" fill="#a5b4fc" opacity="0.35">0 10 110 1110 1111</text>

  <!-- tree icon -->
  <g stroke="url(#accent)" stroke-width="3" stroke-linecap="round" fill="none" transform="translate(70,95)">
    <line x1="40" y1="0" x2="15" y2="35"/>
    <line x1="40" y1="0" x2="65" y2="35"/>
    <line x1="65" y1="35" x2="50" y2="70"/>
    <line x1="65" y1="35" x2="80" y2="70"/>
  </g>
  <g transform="translate(70,95)" fill="#22d3ee">
    <circle cx="40" cy="0" r="7"/>
    <circle cx="15" cy="35" r="7" fill="#fde68a"/>
    <circle cx="65" cy="35" r="7"/>
    <circle cx="50" cy="70" r="7" fill="#f472b6"/>
    <circle cx="80" cy="70" r="7" fill="#f472b6"/>
  </g>

  <text x="200" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff">Modified Huffman Coder</text>
  <rect x="202" y="152" width="200" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="200" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#c7d2fe">Lossless text compression with an "Others" escape code</text>
</svg>
