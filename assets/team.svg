@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.sp{transform-box:fill-box;transform-origin:center;animation:twinkle 3s ease-in-out infinite;opacity:0}
#f0{animation:float 5s ease-in-out 0.0s infinite}#s0,#h0{animation:sweep 5s ease-in-out 0.0s infinite}#h0{animation-delay:0.12s}#f1{animation:float 5s ease-in-out 0.9s infinite}#s1,#h1{animation:sweep 5s ease-in-out 0.9s infinite}#h1{animation-delay:1.02s}#f2{animation:float 5s ease-in-out 1.8s infinite}#s2,#h2{animation:sweep 5s ease-in-out 1.8s infinite}#h2{animation-delay:1.92s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.sp{opacity:.8}}
</style>
