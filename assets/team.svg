<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="Team: Badr Rafik, Kareem Ahmed, Mohamed Saed" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="55%" stop-color="#312e81"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#f472b6"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#f472b6"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".45"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="holo" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/><stop offset="30%" stop-color="#22d3ee" stop-opacity=".3"/><stop offset="60%" stop-color="#f472b6" stop-opacity=".3"/><stop offset="85%" stop-color="#fde68a" stop-opacity=".25"/><stop offset="100%" stop-color="#fde68a" stop-opacity="0"/></linearGradient>
  <clipPath id="clip"><rect width="900" height="270" rx="20"/></clipPath>
  <clipPath id="cardclip"><rect width="250" height="150" rx="16"/></clipPath>
  <clipPath id="allcards"><rect x="50" y="78" width="250" height="150" rx="16"/><rect x="325" y="78" width="250" height="150" rx="16"/><rect x="600" y="78" width="250" height="150" rx="16"/></clipPath>
</defs>
<style>
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sweep{from{transform:translateX(-170px)}to{transform:translateX(1000px)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.sp{transform-box:fill-box;transform-origin:center;animation:twinkle 3s ease-in-out infinite;opacity:0}
#float{animation:float 5s ease-in-out infinite}
#sweep{animation:sweep 4s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.sp{opacity:.8}}
</style>
<g clip-path="url(#clip)">
  <rect width="900" height="270" fill="url(#bg)"/>
  <path class="sp" style="animation-delay:0s" d="M30 33 L32 38 L37 40 L32 42 L30 47 L28 42 L23 40 L28 38Z" fill="#fde68a"/><path class="sp" style="animation-delay:1.1s" d="M870 53 L872 58 L877 60 L872 62 L870 67 L868 62 L863 60 L868 58Z" fill="#fde68a"/><path class="sp" style="animation-delay:2.2s" d="M460 243 L462 248 L467 250 L462 252 L460 257 L458 252 L453 250 L458 248Z" fill="#fde68a"/><path class="sp" style="animation-delay:0.6s" d="M120 238 L122 243 L127 245 L122 247 L120 252 L118 247 L113 245 L118 243Z" fill="#fde68a"/><path class="sp" style="animation-delay:1.7s" d="M790 233 L792 238 L797 240 L792 242 L790 247 L788 242 L783 240 L788 238Z" fill="#fde68a"/>
  <text x="450" y="46" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" letter-spacing="8" fill="#a5b4fc">THE TEAM</text>
  <rect x="420" y="56" width="60" height="3" rx="1.5" fill="url(#accent)"/>
  <g id="float">
    
    <g transform="translate(50,78)">
      <rect width="250" height="150" rx="16" fill="url(#card)" stroke="url(#edge)" stroke-width="2"/>
      <rect x="1" y="1" width="248" height="148" rx="15" fill="none" stroke="#22d3ee" stroke-opacity=".35"/>
      <g clip-path="url(#cardclip)"><circle cx="235" cy="10" r="70" fill="#22d3ee" opacity=".12"/></g>
      <rect x="20" y="20" width="36" height="27" rx="6" fill="url(#gold)"/>
      <path d="M20 33.5h36M32 20v27M44 20v27" stroke="#92400e" stroke-opacity=".45" stroke-width="1" fill="none"/>
      <circle cx="214" cy="34" r="18" fill="#22d3ee"/>
      <text x="214" y="40" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0f172a">BR</text>
      <text x="22" y="88" font-family="Consolas,Menlo,monospace" font-size="15" letter-spacing="3" fill="#22d3ee" opacity=".8">1000 1101 0001 1010</text>
      <text x="22" y="122" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="25" font-weight="800" fill="#ffffff">Badr Rafik</text>
      <rect x="22" y="132" width="60" height="3" rx="1.5" fill="#22d3ee"/>
    </g>
    <g transform="translate(325,78)">
      <rect width="250" height="150" rx="16" fill="url(#card)" stroke="url(#edge)" stroke-width="2"/>
      <rect x="1" y="1" width="248" height="148" rx="15" fill="none" stroke="#a78bfa" stroke-opacity=".35"/>
      <g clip-path="url(#cardclip)"><circle cx="235" cy="10" r="70" fill="#a78bfa" opacity=".12"/></g>
      <rect x="20" y="20" width="36" height="27" rx="6" fill="url(#gold)"/>
      <path d="M20 33.5h36M32 20v27M44 20v27" stroke="#92400e" stroke-opacity=".45" stroke-width="1" fill="none"/>
      <circle cx="214" cy="34" r="18" fill="#a78bfa"/>
      <text x="214" y="40" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0f172a">KA</text>
      <text x="22" y="88" font-family="Consolas,Menlo,monospace" font-size="15" letter-spacing="3" fill="#a78bfa" opacity=".8">0011 0100 1110 1111</text>
      <text x="22" y="122" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="25" font-weight="800" fill="#ffffff">Kareem Ahmed</text>
      <rect x="22" y="132" width="60" height="3" rx="1.5" fill="#a78bfa"/>
    </g>
    <g transform="translate(600,78)">
      <rect width="250" height="150" rx="16" fill="url(#card)" stroke="url(#edge)" stroke-width="2"/>
      <rect x="1" y="1" width="248" height="148" rx="15" fill="none" stroke="#f472b6" stroke-opacity=".35"/>
      <g clip-path="url(#cardclip)"><circle cx="235" cy="10" r="70" fill="#f472b6" opacity=".12"/></g>
      <rect x="20" y="20" width="36" height="27" rx="6" fill="url(#gold)"/>
      <path d="M20 33.5h36M32 20v27M44 20v27" stroke="#92400e" stroke-opacity=".45" stroke-width="1" fill="none"/>
      <circle cx="214" cy="34" r="18" fill="#f472b6"/>
      <text x="214" y="40" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0f172a">MS</text>
      <text x="22" y="88" font-family="Consolas,Menlo,monospace" font-size="15" letter-spacing="3" fill="#f472b6" opacity=".8">1010 0011 0100 1110</text>
      <text x="22" y="122" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="25" font-weight="800" fill="#ffffff">Mohamed Saed</text>
      <rect x="22" y="132" width="60" height="3" rx="1.5" fill="#f472b6"/>
    </g>
    <!-- one continuous shine across all three cards -->
    <g clip-path="url(#allcards)">
      <g id="sweep">
        <polygon points="-20,50 70,50 20,260 -70,260" fill="url(#holo)"/>
        <polygon points="40,50 100,50 50,260 -10,260" fill="url(#shine)"/>
      </g>
    </g>
  </g>
</g>
</svg>